[package]
name = "infr-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
bytesize = { version = "2.7.0", features = ["serde"] }
clap = { version = "4.6.9", features = ["derive"] }
eyre = "0.6.14"
futures-util = "0.3.34"
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "grpc-tonic"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
prometheus_exporter = "0.8.5"
reqwest = { version = "0.13.5", default-features = false, features = ["default-tls", "json", "query", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "time", "fs", "io-util", "sync", "net"] }
toml = "1.2.2"
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.34.0", default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "registry"] }
zbus = { version = "6.5.0", default-features = false, features = ["tokio", "tokio-multithread", "proxy", "tracing"] }

[dev-dependencies]
tempfile = "3.27.0"
